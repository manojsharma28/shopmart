name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push Docker images
      uses: docker/build-push-action@v2
      with:
        context: .
        push: false
        tags: |
          payment-service:latest
          order-service:latest
          notification-service:latest
          inventory-service:latest

    - name: Run tests (example for OrderService)
      run: |
        docker run --rm order-service:latest dotnet test /app/tests/OrderService.Tests/OrderService.Tests.csproj --logger "trx;LogFileName=TestResults.trx"