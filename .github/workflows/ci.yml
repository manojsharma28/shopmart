name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Restore .NET dependencies
      run: dotnet restore OrderService.Tests/OrderService.Tests.csproj

    - name: Build Docker Compose services
      working-directory: ${{ github.workspace }}
      run: docker compose -f docker-compose.yml build

    - name: Start services
      working-directory: ${{ github.workspace }}
      run: docker compose -f docker-compose.yml up -d

    - name: Wait for backend
      run: |
        for i in $(seq 1 10); do
          if curl -s http://localhost:5003/api/inventory/products; then
            exit 0
          fi
          sleep 5
        done
        exit 1

    - name: Run .NET unit tests
      run: dotnet test OrderService.Tests/OrderService.Tests.csproj --configuration Release --no-restore

    - name: Tear down
      working-directory: ${{ github.workspace }}
      run: docker compose -f docker-compose.yml down
